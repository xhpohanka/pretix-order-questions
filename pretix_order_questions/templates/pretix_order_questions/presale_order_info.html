{% load i18n %}
<div class="panel panel-default">
    <div class="panel-heading"><h3 class="panel-title">{% trans "Additional information" %}</h3></div>
    <div class="panel-body">
        <dl class="dl-horizontal">
            {% for answer in answers %}
                <dt>{{ answer.question.question }}</dt>
                <dd>{{ answer.display_value|linebreaksbr }}</dd>
            {% endfor %}
        </dl>
    </div>
</div>
